name: heatwatch

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: "10m"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      API_KEYS: ${API_KEY:?API_KEY is required}
      CORS_ORIGINS: ${SITE_ORIGIN:?SITE_ORIGIN is required}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    init: true
    logging: *default-logging

  ingest:
    build:
      context: ../backend
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python -m app.ingestion.run
          sleep "$${INGEST_INTERVAL_SECONDS}"
        done
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INGEST_INTERVAL_SECONDS: ${INGEST_INTERVAL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - egress
    read_only: true
    tmpfs:
      - /tmp
    init: true
    healthcheck:
      disable: true
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      HEATWATCH_API_KEY: ${API_KEY:?API_KEY is required}
      HEATWATCH_API_URL: http://api:8000
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
      - edge
    init: true
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-./data}/caddy-data:/data
      - ${DATA_ROOT:-./data}/caddy-config:/config
    depends_on:
      - frontend
    networks:
      - edge
    logging: *default-logging

networks:
  backend:
    internal: true
  edge:
  egress:
